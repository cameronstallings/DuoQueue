<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DuoQueue Moderation</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --surface: #ffffff;
    --border: #e4e4e7;
    --text: #17171a;
    --muted: #6b6b72;
    --brand: #7c4dff;
    --danger: #e5484d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113;
      --surface: #1c1c1f;
      --border: #2c2c30;
      --text: #f4f4f5;
      --muted: #a1a1aa;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  #app { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin-bottom: 4px; display: flex; align-items: center; gap: 10px; }
  h1 svg { flex: none; }
  .muted { color: var(--muted); font-size: 13px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-top: 16px;
  }
  input, select, textarea, button {
    font: inherit;
    color: inherit;
  }
  input, textarea {
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    margin-bottom: 8px;
  }
  button {
    padding: 8px 14px;
    border-radius: 8px;
    border: none;
    background: var(--brand);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
  }
  button.secondary { background: var(--border); color: var(--text); }
  button.danger { background: var(--danger); }
  button:disabled { opacity: 0.5; cursor: default; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  .status-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    background: var(--border);
  }
  .status-open { background: var(--danger); color: #fff; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .filters { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  #error { color: var(--danger); font-size: 13px; margin-top: 8px; }
  .convo { background: var(--bg); border-radius: 8px; padding: 8px; margin-top: 8px; max-height: 240px; overflow-y: auto; }
  .convo-msg { padding: 4px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
</style>
</head>
<body>
<div id="app"></div>

<!-- Optional, gitignored. Absent in a fresh clone, which is fine — the module below
     falls back to placeholders and the page shows a clear connection error. -->
<script src="./config.js"></script>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  // Point this at your project. Either drop a gitignored `admin/config.js` next to this
  // file (copy config.example.js), or edit the fallbacks below.
  //
  // The anon key is safe to ship client-side — every query here still goes through RLS,
  // gated by profiles.is_admin (0006_moderation_and_notifications.sql). It is kept out of
  // git anyway: a committed key advertises which project this page administers, and this
  // page is the one surface where an is_admin account can read reports and private
  // messages. Nothing is lost by not publishing that pointer.
  const cfg = globalThis.DUOQUEUE_ADMIN_CONFIG ?? {};
  const SUPABASE_URL = cfg.supabaseUrl ?? "https://YOUR-PROJECT-REF.supabase.co";
  const SUPABASE_ANON_KEY = cfg.supabaseAnonKey ?? "YOUR-ANON-KEY";

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const app = document.getElementById("app");

  // The rings mark (see scripts/generate-app-icons.mjs for the geometry's source
  // of truth): O in the page text color, Q in muted — same chain weave as the app.
  const MARK = `<svg width="32" height="20" viewBox="69.9 243.5 859.6 537" aria-hidden="true">
    <circle cx="660.99" cy="512" r="215.04" fill="none" stroke="var(--muted)" stroke-width="98.92" />
    <circle cx="842.43" cy="693.44" r="55.4" fill="var(--muted)" />
    <circle cx="338.43" cy="512" r="215.04" fill="none" stroke="currentColor" stroke-width="98.92" />
    <path d="M 583.57 712.63 A 215.04 215.04 0 0 1 452.24 563.70" fill="none" stroke="var(--muted)" stroke-width="98.92" />
  </svg>`;

  const REASON_LABELS = {
    harassment: "Harassment",
    spam: "Spam",
    inappropriate_content: "Inappropriate content",
    underage: "Underage",
    other: "Other",
  };

  // Escapes for BOTH text and attribute contexts. The textContent round-trip alone
  // handles < > &, but leaves quotes intact — fine inside a text node, an escape hatch
  // inside an attribute. Everything on this page is user-generated content being shown
  // to an admin, so it all gets the stricter treatment.
  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  async function render() {
    const {
      data: { session },
    } = await supabase.auth.getSession();

    if (!session) {
      renderLogin();
      return;
    }

    const { data: profile, error: profileError } = await supabase
      .from("profiles")
      .select("is_admin, display_name")
      .eq("id", session.user.id)
      .single();

    if (profileError || !profile?.is_admin) {
      renderNotAuthorized();
      return;
    }

    await renderDashboard(profile.display_name);
  }

  function renderLogin() {
    app.innerHTML = `
      <h1>${MARK}DuoQueue Moderation</h1>
      <p class="muted">Sign in with an admin account.</p>
      <div class="card" style="max-width:360px">
        <input id="email" type="email" placeholder="Email" autocomplete="username" />
        <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
        <button id="signin">Sign in</button>
        <div id="error"></div>
      </div>
    `;
    document.getElementById("signin").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const errorEl = document.getElementById("error");
      errorEl.textContent = "";
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        errorEl.textContent = error.message;
        return;
      }
      await render();
    });
  }

  function renderNotAuthorized() {
    app.innerHTML = `
      <h1>${MARK}DuoQueue Moderation</h1>
      <div class="card">
        <p>This account isn't an admin. Ask an operator to set <code>profiles.is_admin = true</code> for your account.</p>
        <button class="secondary" id="signout">Sign out</button>
      </div>
    `;
    document.getElementById("signout").addEventListener("click", async () => {
      await supabase.auth.signOut();
      await render();
    });
  }

  async function fetchReports(statusFilter) {
    let query = supabase
      .from("reports")
      .select("id, reason, details, status, created_at, match_id, reporter_id, reported_id")
      .order("created_at", { ascending: false });
    if (statusFilter !== "all") query = query.eq("status", statusFilter);

    const { data: reports, error } = await query;
    if (error) throw error;
    if (!reports || reports.length === 0) return [];

    const profileIds = [...new Set(reports.flatMap((r) => [r.reporter_id, r.reported_id]))];
    const { data: profiles, error: profilesError } = await supabase
      .from("profiles")
      .select("id, display_name")
      .in("id", profileIds);
    if (profilesError) throw profilesError;

    const nameById = new Map((profiles ?? []).map((p) => [p.id, p.display_name]));
    return reports.map((r) => ({
      ...r,
      reporterName: nameById.get(r.reporter_id) ?? r.reporter_id,
      reportedName: nameById.get(r.reported_id) ?? r.reported_id,
    }));
  }

  async function updateReportStatus(reportId, status) {
    const {
      data: { session },
    } = await supabase.auth.getSession();
    const { error } = await supabase
      .from("reports")
      .update({ status, reviewed_by: session.user.id, reviewed_at: new Date().toISOString() })
      .eq("id", reportId);
    if (error) alert(error.message);
  }

  async function loadConversation(containerEl, matchId) {
    containerEl.innerHTML = "Loading...";
    const { data: messages, error } = await supabase
      .from("messages")
      .select("sender_id, content, created_at")
      .eq("match_id", matchId)
      .order("created_at")
      .limit(100);
    if (error) {
      containerEl.textContent = error.message;
      return;
    }
    containerEl.innerHTML = (messages ?? [])
      .map(
        (m) =>
          `<div class="convo-msg"><strong>${escapeHtml(m.sender_id.slice(0, 8))}</strong>: ${escapeHtml(m.content)}</div>`,
      )
      .join("") || "<em>No messages in this conversation.</em>";
  }

  async function renderDashboard(adminName) {
    app.innerHTML = `
      <h1>${MARK}DuoQueue Moderation</h1>
      <p class="muted">Signed in as ${escapeHtml(adminName)}</p>
      <div class="card">
        <div class="filters">
          <label for="status-filter">Status:</label>
          <select id="status-filter">
            <option value="open">Open</option>
            <option value="reviewed">Reviewed</option>
            <option value="actioned">Actioned</option>
            <option value="dismissed">Dismissed</option>
            <option value="all">All</option>
          </select>
          <button class="secondary" id="refresh">Refresh</button>
          <button class="secondary" id="signout" style="margin-left:auto">Sign out</button>
        </div>
        <div id="reports-table">Loading...</div>
      </div>
      <div class="card">
        <div class="filters">
          <strong>Pending photos</strong>
          <button class="secondary" id="refresh-photos" style="margin-left:auto">Refresh</button>
        </div>
        <div id="photos-table">Loading...</div>
      </div>
      <div class="card">
        <div class="filters">
          <strong>Pending voice intros</strong>
          <button class="secondary" id="refresh-voice" style="margin-left:auto">Refresh</button>
        </div>
        <div id="voice-intros-table">Loading...</div>
      </div>
    `;

    document.getElementById("signout").addEventListener("click", async () => {
      await supabase.auth.signOut();
      await render();
    });
    document.getElementById("status-filter").addEventListener("change", loadReports);
    document.getElementById("refresh").addEventListener("click", loadReports);
    document.getElementById("refresh-voice").addEventListener("click", loadVoiceIntros);
    document.getElementById("refresh-photos").addEventListener("click", loadPhotos);

    // Photos land here when the automated check can't reach a verdict — a provider
    // outage, a timeout, or no credentials configured. moderate-photo fails closed, so
    // without this queue those photos would sit invisible forever with no way out.
    async function loadPhotos() {
      const tableEl = document.getElementById("photos-table");
      tableEl.textContent = "Loading...";
      try {
        const { data: media, error } = await supabase
          .from("profile_media")
          .select("id, profile_id, storage_path, photo_role, created_at")
          .eq("moderation_status", "pending")
          .order("created_at");
        if (error) throw error;
        if (!media || media.length === 0) {
          tableEl.innerHTML = "<p class='muted'>No pending photos.</p>";
          return;
        }

        const { data: profiles, error: profilesError } = await supabase
          .from("profiles")
          .select("id, display_name")
          .in("id", media.map((m) => m.profile_id));
        if (profilesError) throw profilesError;
        const nameById = new Map((profiles ?? []).map((p) => [p.id, p.display_name]));

        const rows = await Promise.all(
          media.map(async (m) => {
            const { data: signed } = await supabase.storage
              .from("profile-photos")
              .createSignedUrl(m.storage_path, 3600);
            return { ...m, name: nameById.get(m.profile_id) ?? m.profile_id, url: signed?.signedUrl };
          }),
        );

        tableEl.innerHTML = `
          <table>
            <thead><tr><th>When</th><th>Profile</th><th>Role</th><th>Photo</th><th>Actions</th></tr></thead>
            <tbody>
              ${rows
                .map(
                  (r) => `
                <tr data-media-id="${escapeHtml(r.id)}">
                  <td>${new Date(r.created_at).toLocaleString()}</td>
                  <td>${escapeHtml(r.name)}</td>
                  <td>${escapeHtml(r.photo_role)}</td>
                  <td>${r.url ? `<img src="${escapeHtml(r.url)}" alt="pending profile photo" style="max-height:120px;max-width:160px;border-radius:8px" />` : "Unavailable"}</td>
                  <td>
                    <div class="actions">
                      <button class="secondary approve-btn">Approve</button>
                      <button class="danger reject-btn">Reject</button>
                    </div>
                  </td>
                </tr>
              `,
                )
                .join("")}
            </tbody>
          </table>
        `;

        tableEl.querySelectorAll("tr[data-media-id]").forEach((row) => {
          const mediaId = row.dataset.mediaId;
          async function review(approve) {
            const { error: rpcError } = await supabase.rpc("review_photo", {
              p_media_id: mediaId,
              p_approve: approve,
            });
            if (rpcError) alert(rpcError.message);
            await loadPhotos();
          }
          row.querySelector(".approve-btn").addEventListener("click", () => review(true));
          row.querySelector(".reject-btn").addEventListener("click", () => review(false));
        });
      } catch (err) {
        tableEl.innerHTML = `<p style="color:var(--danger)">${escapeHtml(err.message ?? String(err))}</p>`;
      }
    }

    async function loadVoiceIntros() {
      const tableEl = document.getElementById("voice-intros-table");
      tableEl.textContent = "Loading...";
      try {
        const { data: intros, error } = await supabase
          .from("profile_voice_intro")
          .select("profile_id, storage_path, duration_seconds, created_at")
          .eq("moderation_status", "pending")
          .order("created_at");
        if (error) throw error;
        if (!intros || intros.length === 0) {
          tableEl.innerHTML = "<p class='muted'>No pending voice intros.</p>";
          return;
        }

        const profileIds = intros.map((i) => i.profile_id);
        const { data: profiles, error: profilesError } = await supabase
          .from("profiles")
          .select("id, display_name")
          .in("id", profileIds);
        if (profilesError) throw profilesError;
        const nameById = new Map((profiles ?? []).map((p) => [p.id, p.display_name]));

        const rows = await Promise.all(
          intros.map(async (intro) => {
            const { data: signed } = await supabase.storage
              .from("voice-intros")
              .createSignedUrl(intro.storage_path, 3600);
            return { ...intro, name: nameById.get(intro.profile_id) ?? intro.profile_id, url: signed?.signedUrl };
          }),
        );

        tableEl.innerHTML = `
          <table>
            <thead><tr><th>When</th><th>Profile</th><th>Length</th><th>Listen</th><th>Actions</th></tr></thead>
            <tbody>
              ${rows
                .map(
                  (r) => `
                <tr data-profile-id="${escapeHtml(r.profile_id)}">
                  <td>${new Date(r.created_at).toLocaleString()}</td>
                  <td>${escapeHtml(r.name)}</td>
                  <td>${escapeHtml(r.duration_seconds)}s</td>
                  <td>${r.url ? `<audio controls src="${escapeHtml(r.url)}" style="height:32px;max-width:180px"></audio>` : "Unavailable"}</td>
                  <td>
                    <div class="actions">
                      <button class="secondary approve-btn">Approve</button>
                      <button class="danger reject-btn">Reject</button>
                    </div>
                  </td>
                </tr>
              `,
                )
                .join("")}
            </tbody>
          </table>
        `;

        tableEl.querySelectorAll("tr[data-profile-id]").forEach((row) => {
          const profileId = row.dataset.profileId;
          row.querySelector(".approve-btn").addEventListener("click", async () => {
            const { error: rpcError } = await supabase.rpc("review_voice_intro", {
              p_profile_id: profileId,
              p_approve: true,
            });
            if (rpcError) alert(rpcError.message);
            await loadVoiceIntros();
          });
          row.querySelector(".reject-btn").addEventListener("click", async () => {
            const { error: rpcError } = await supabase.rpc("review_voice_intro", {
              p_profile_id: profileId,
              p_approve: false,
            });
            if (rpcError) alert(rpcError.message);
            await loadVoiceIntros();
          });
        });
      } catch (err) {
        tableEl.innerHTML = `<p style="color:var(--danger)">${escapeHtml(err.message ?? String(err))}</p>`;
      }
    }

    async function loadReports() {
      const statusFilter = document.getElementById("status-filter").value;
      const tableEl = document.getElementById("reports-table");
      tableEl.textContent = "Loading...";
      try {
        const reports = await fetchReports(statusFilter);
        if (reports.length === 0) {
          tableEl.innerHTML = "<p class='muted'>No reports in this view.</p>";
          return;
        }
        tableEl.innerHTML = `
          <table>
            <thead>
              <tr><th>When</th><th>Reason</th><th>Reporter</th><th>Reported</th><th>Details</th><th>Status</th><th>Actions</th></tr>
            </thead>
            <tbody>
              ${reports
                .map(
                  (r) => `
                <tr data-id="${escapeHtml(r.id)}">
                  <td>${new Date(r.created_at).toLocaleString()}</td>
                  <td>${escapeHtml(REASON_LABELS[r.reason] ?? r.reason)}</td>
                  <td>${escapeHtml(r.reporterName)}</td>
                  <td>${escapeHtml(r.reportedName)}</td>
                  <td>${escapeHtml(r.details ?? "")}</td>
                  <td><span class="status-badge ${r.status === "open" ? "status-open" : ""}">${escapeHtml(r.status)}</span></td>
                  <td>
                    <div class="actions">
                      <button class="secondary review-btn">Reviewed</button>
                      <button class="secondary action-btn">Actioned</button>
                      <button class="secondary dismiss-btn">Dismissed</button>
                      ${r.match_id ? `<button class="secondary convo-btn">View chat</button>` : ""}
                    </div>
                    <div class="convo" style="display:none"></div>
                  </td>
                </tr>
              `,
                )
                .join("")}
            </tbody>
          </table>
        `;

        tableEl.querySelectorAll("tr[data-id]").forEach((row) => {
          const reportId = row.dataset.id;
          const report = reports.find((r) => r.id === reportId);

          row.querySelector(".review-btn").addEventListener("click", async () => {
            await updateReportStatus(reportId, "reviewed");
            await loadReports();
          });
          row.querySelector(".action-btn").addEventListener("click", async () => {
            await updateReportStatus(reportId, "actioned");
            await loadReports();
          });
          row.querySelector(".dismiss-btn").addEventListener("click", async () => {
            await updateReportStatus(reportId, "dismissed");
            await loadReports();
          });
          const convoBtn = row.querySelector(".convo-btn");
          if (convoBtn) {
            convoBtn.addEventListener("click", async () => {
              const convoEl = row.querySelector(".convo");
              const isHidden = convoEl.style.display === "none";
              convoEl.style.display = isHidden ? "block" : "none";
              if (isHidden) await loadConversation(convoEl, report.match_id);
            });
          }
        });
      } catch (err) {
        tableEl.innerHTML = `<p style="color:var(--danger)">${escapeHtml(err.message ?? String(err))}</p>`;
      }
    }

    await loadReports();
    await loadPhotos();
    await loadVoiceIntros();
  }

  render();
</script>
</body>
</html>
