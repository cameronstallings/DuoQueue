<!--
  Password reset email: a 6-digit code, NOT a link.

  The app resets a password with a typed code: resetPasswordForEmail(email), then
  verifyOtp({ email, token, type: "recovery" }), then updateUser({ password }). There is
  no reset link on purpose, for two reasons:
    1. The app declares no universal links, and the hosted site_url is still
       http://localhost:3000, so a link in this email would open nothing useful on a phone.
    2. Mail scanners and link-preview bots pre-fetch links in incoming mail, and the
       recovery token is single-use. A scanner "clicking" a link burns it before the player
       types the code. A number can't be pre-fetched.

  So this uses the Token variable only, and deliberately NOT the ConfirmationURL one. Do
  not write that variable's name in template syntax anywhere in this file, including inside
  this comment: Go's template engine expands it wherever it appears, which would embed a
  live single-use link in the email source. (Checked in the Auth server source, 14 Oct
  2026: RecoveryMail passes Token as the email OTP, the same as the signup code.)

  The code's length and lifetime are the project's email OTP settings, shared with the
  signup code: 6 digits and 3600 s on the hosted project (mailer_otp_length,
  mailer_otp_exp), the same as otp_length / otp_expiry in config.toml. "One hour" below
  depends on that.

  This file is used by `supabase start` (see [auth.email.template.recovery] in
  config.toml). The hosted project keeps its own copy in mailer_templates_recovery_content
  (Authentication -> Emails -> Reset password), set through the Management API. Change
  both together. The hosted copy must be live BEFORE any build with "Forgot password?" is
  released, or that screen sends the default email, which has a link and no code.

  No em dashes anywhere in this file: it is public copy.
-->
<div style="margin:0;padding:32px 16px;background:#F6F6F9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <div style="max-width:440px;margin:0 auto;background:#FFFFFF;border-radius:20px;padding:32px;">
    <div style="font-size:22px;font-weight:800;letter-spacing:-0.5px;color:#7C4DFF;margin-bottom:24px;">
      DuoQueue
    </div>

    <div style="font-size:20px;font-weight:700;letter-spacing:-0.3px;color:#12121A;margin-bottom:8px;">
      Reset your password
    </div>
    <div style="font-size:15px;line-height:22px;color:#5B5B66;margin-bottom:24px;">
      Enter this code in the app to choose a new password.
    </div>

    <div style="background:#F6F6F9;border-radius:12px;padding:20px;text-align:center;margin-bottom:24px;">
      <div style="font-size:34px;font-weight:800;letter-spacing:8px;color:#12121A;font-variant-numeric:tabular-nums;">
        {{ .Token }}
      </div>
    </div>

    <div style="font-size:13px;line-height:20px;color:#8A8A96;">
      This code expires in one hour. If you didn't ask to reset your password, you can ignore
      this email. Your password stays the same. Don't share this code with anyone: it signs
      in to your DuoQueue account.
    </div>
  </div>
</div>
