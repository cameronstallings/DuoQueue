<!--
  Signup confirmation email — 6-digit code, NOT a link.

  {{ .Token }} only. Deliberately no {{ .ConfirmationURL }}: corporate mail scanners
  and link-preview bots pre-fetch URLs in incoming mail, and Supabase's confirmation
  token is single-use — a scanner "clicking" it burns the token before the user does,
  and the code they type then fails as expired. A number can't be pre-fetched.

  This file is used by `supabase start` (see [auth.email.template.confirmation] in
  config.toml). The hosted project keeps its own copy, pasted by hand into
  Authentication -> Email Templates -> Confirm signup. Change both together.
-->
<div style="margin:0;padding:32px 16px;background:#F6F6F9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <div style="max-width:440px;margin:0 auto;background:#FFFFFF;border-radius:20px;padding:32px;">
    <div style="font-size:22px;font-weight:800;letter-spacing:-0.5px;color:#7C4DFF;margin-bottom:24px;">
      DuoQueue
    </div>

    <div style="font-size:20px;font-weight:700;letter-spacing:-0.3px;color:#12121A;margin-bottom:8px;">
      Confirm your email
    </div>
    <div style="font-size:15px;line-height:22px;color:#5B5B66;margin-bottom:24px;">
      Enter this code in the app to finish creating your account.
    </div>

    <div style="background:#F6F6F9;border-radius:12px;padding:20px;text-align:center;margin-bottom:24px;">
      <div style="font-size:34px;font-weight:800;letter-spacing:8px;color:#12121A;font-variant-numeric:tabular-nums;">
        {{ .Token }}
      </div>
    </div>

    <div style="font-size:13px;line-height:20px;color:#8A8A96;">
      This code expires in one hour. If you didn't sign up for DuoQueue, you can ignore
      this email — no account is created until the code is entered.
    </div>
  </div>
</div>
