# Supabase CLI project config — used by `supabase start` / `supabase db reset` for local dev.
# See https://supabase.com/docs/guides/local-development/cli/config for the full reference.

project_id = "duoqueue"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed/seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[storage.buckets.profile-photos]
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

[auth]
enabled = true
site_url = "duoqueue://"
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 10
# Exactly matches describePasswordProblem() in app/(auth)/sign-up.tsx.
password_requirements = "lower_upper_letters_digits"

# Email confirmation is OTP-based: signUp() returns no session, and
# app/(auth)/confirm-email.tsx calls verifyOtp() with the typed code, which issues the
# session and fires onAuthStateChange (src/store/session-store.ts). dob/timezone ride in
# through options.data and are written by handle_new_user() (0030/0031), so no
# authenticated write is needed before confirmation — that was the original reason
# confirmations were off, and it no longer applies.
#
# Not deep-link based on purpose: app.json declares no associatedDomains/intentFilters,
# so a `duoqueue://` link has no https fallback and does nothing when mail is read on a
# desktop, and PKCE binds the verifier to the device that signed up.
#
# This file configures LOCAL dev only (`supabase start`, mail caught by Inbucket on
# :54324). The hosted project's "Confirm email" toggle, SMTP settings and template are
# separate and edited in the Dashboard — see README step 7.
[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Your DuoQueue confirmation code"
# Relative to the PROJECT ROOT (the directory containing supabase/), not to this file.
# It read "./templates/confirmation.html" until 2026-08-21, which CLI 2.115 resolves to
# <root>/templates/confirmation.html — a path that does not exist — and it refuses to parse
# the config at all, so `supabase functions deploy` failed for EVERY function with an error
# that names the auth template and nothing to do with functions. Matches the form the
# Supabase docs use ("./supabase/templates/invite.html").
content_path = "./supabase/templates/confirmation.html"

[auth.external.apple]
enabled = false
client_id = "env(APPLE_CLIENT_ID)"
secret = "env(APPLE_CLIENT_SECRET)"

[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"

[edge_runtime]
enabled = true
policy = "oneshot"

[functions.send-message]
verify_jwt = true

[functions.moderate-photo]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

# External/internal callers authenticate with their own shared secret instead of a
# Supabase-issued JWT, so the gateway-level JWT check must be off for these two.
[functions.revenuecat-webhook]
verify_jwt = false

[functions.send-push-notification]
verify_jwt = false

[functions.daily-swipes-refreshed]
verify_jwt = false

[functions.send-reengagement-nudges]
verify_jwt = false

[functions.sync-verified-stats]
verify_jwt = false

# Reached by a browser redirect from Steam at the end of the OpenID flow, which cannot
# carry a Supabase JWT. Authorization comes from the signed OpenID assertion plus the
# one-time state token issued by start_steam_link(). Stated here rather than left to
# the verify_jwt=true default (or a --no-verify-jwt flag in someone's shell history)
# so that this endpoint's posture is reviewable in source.
[functions.link-steam-callback]
verify_jwt = false

# POSTed to by an ordinary HTML <form> on the static duoqueue.io waitlist page, by a
# member of the public who has no account and therefore no Supabase JWT to send. So unlike
# every other verify_jwt = false function above, this one has NO shared secret gate and no
# signed third-party assertion behind it either — it cannot, and that is the point of it.
#
# What bounds it instead: a 4 KB streamed body cap, one attempt row per request written
# before any decision, 10/hour and 30/day per salted IP hash, a honeypot, server-side
# validation of every field, a four-value allow-list on the only influenceable string, a
# kill switch row in app_config, an 80/day budget on outbound email, and the fact that its
# only write is one insert into a table with RLS on, zero policies and zero grants to anon
# or authenticated (0061_waitlist.sql). Stated here rather than left to a flag in
# somebody's shell history so that the posture is reviewable in source.
[functions.waitlist-signup]
verify_jwt = false
